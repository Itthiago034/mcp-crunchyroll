name: crunchyroll
version: "1.0.0"
manifest_version: 1

description: >-
  Crunchyroll anime streaming MCP connector. Search anime series and movies,
  browse by genre or popularity, view series/season/episode details, manage
  your watchlist, track viewing progress, and get personalized recommendations.

source: https://github.com/Itthiago034/mcp-crunchyroll

install:
  bootstrap:
    - npm install --production
  git:
    url: https://github.com/Itthiago034/mcp-crunchyroll
    ref: main

transport:
  command: npx
  args:
    - -y
    - tsx
    - src/index.ts
  env: {}

auth: none

tools:
  default_enabled: []

notes:
  - "Authentication is interactive and browser-based. Call the crunchyroll_login tool with NO arguments: it opens a dedicated managed browser on Crunchyroll's own login page, where the user signs in directly. Never ask the user for their Crunchyroll email or password, and never pass credentials to this server — the login tool accepts no arguments at all."
  - "Readiness comes only from an authentication response the server observes and validates; a page that merely looks signed in is not enough. Check crunchyroll_status (authenticated, auth_state, profile_ready). The observed bearer is held in memory and never written to disk; what persists is the browser's own session in the dedicated profile at ~/.strider/crunchyroll/browser-profile."
  - "Human verification (CAPTCHA and similar) is always solved by the user in the browser, never automated or bypassed. If it does not complete in the managed window, the login ends at LOGIN_REQUIRED and the user can establish the session themselves in that same dedicated profile — see Supported Human Onboarding in the README."
  - "Content IDs are available in search/browse results or in Crunchyroll URLs (e.g. https://www.crunchyroll.com/series/G6W4Q7MKY)."
  - "This server uses the Crunchyroll web API, so its endpoints may change over time."
  - "Requires Node.js >= 18. The bootstrap installs dependencies with npm; tsx runs the TypeScript source directly via npx. For production use, run `npm run build` and point the command at dist/index.js."
