<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="MCP Crunchyroll banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="1" stop-color="#1b2130"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a1a"/>
      <stop offset="1" stop-color="#f55d1f"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a1a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff8a1a" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff8a1a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- abstract streaming waves -->
  <path d="M0 260 C 150 230, 300 280, 450 255 S 750 225, 900 258 S 1120 285, 1200 262 L 1200 320 L 0 320 Z" fill="#1e2636" opacity="0.9"/>
  <path d="M0 285 C 180 262, 330 300, 500 282 S 780 265, 940 288 S 1140 300, 1200 290 L 1200 320 L 0 320 Z" fill="#263048" opacity="0.85"/>

  <!-- abstract terminal / MCP nodes -->
  <g stroke="#3a455c" stroke-width="1.2" opacity="0.8">
    <line x1="150" y1="112" x2="420" y2="112"/>
    <line x1="560" y1="112" x2="700" y2="112"/>
    <circle cx="420" cy="112" r="5" fill="#ff8a1a"/>
    <circle cx="560" cy="112" r="5" fill="#ff8a1a"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" fill="#7d8aa8">
    <text x="150" y="92">LLM / Agent</text>
    <text x="432" y="92">MCP</text>
    <text x="572" y="92">Crunchyroll</text>
  </g>

  <!-- title -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="150" y="180" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="1">MCP <tspan fill="url(#accent)">CRUNCHYROLL</tspan></text>
    <text x="152" y="218" font-size="20" fill="#b9c3d8">Model Context Protocol server · Account &amp; Catalog capabilities</text>
  </g>

  <!-- divider -->
  <rect x="150" y="238" width="900" height="2" fill="url(#lineGrad)"/>

  <!-- chips -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#0d1117">
    <rect x="150" y="256" width="138" height="28" rx="14" fill="url(#accent)"/>
    <text x="176" y="275">TypeScript</text>
    <rect x="302" y="256" width="118" height="28" rx="14" fill="url(#accent)"/>
    <text x="328" y="275">MCP</text>
    <rect x="434" y="256" width="138" height="28" rx="14" fill="url(#accent)"/>
    <text x="458" y="275">Node 18+</text>
    <rect x="586" y="256" width="138" height="28" rx="14" fill="url(#accent)"/>
    <text x="612" y="275">Local-first</text>
    <rect x="738" y="256" width="118" height="28" rx="14" fill="url(#accent)"/>
    <text x="766" y="275">MIT</text>
  </g>

  <!-- subtle dot grid, right side -->
  <g fill="#ff8a1a" opacity="0.15">
    <circle cx="1010" cy="80" r="3"/><circle cx="1050" cy="80" r="3"/><circle cx="1090" cy="80" r="3"/><circle cx="1130" cy="80" r="3"/>
    <circle cx="1010" cy="120" r="3"/><circle cx="1050" cy="120" r="3"/><circle cx="1090" cy="120" r="3"/><circle cx="1130" cy="120" r="3"/>
    <circle cx="1010" cy="160" r="3"/><circle cx="1050" cy="160" r="3"/><circle cx="1090" cy="160" r="3"/><circle cx="1130" cy="160" r="3"/>
    <circle cx="1010" cy="200" r="3"/><circle cx="1050" cy="200" r="3"/><circle cx="1090" cy="200" r="3"/><circle cx="1130" cy="200" r="3"/>
  </g>
</svg>
