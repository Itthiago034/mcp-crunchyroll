<style>text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Liberation Mono',monospace}.route{stroke-dasharray:7 9;animation:route 4s ease-out 1}@keyframes route{from{stroke-dashoffset:80}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.route{animation:none}}</style>
