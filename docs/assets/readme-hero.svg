<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="title desc">
<title id="title">MCP Crunchyroll — your agent, your anime</title>
<desc id="desc">An unofficial connector for discovery, account tools and the official web player. Illustrative tool names, not a recorded execution.</desc>
